[package]
name = "rcloneflix"
version = "1.0.32"
description = "RcloneFlix - Stream media from rclone remotes"
authors = ["RcloneFlix"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "rcloneflix_lib"
crate-type = ["rlib"]


[[bin]]
name = "rcloneflix"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-http = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
portpicker = "0.1"
vlc-rs = "0.3"
raw-window-handle = "0.6"
regex = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }
base64 = "0.23.1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
log = "0.4"
rust_cast = "0.21.0"
percent-encoding = "2.3"
grammers-client = "0.7.0"
grammers-session = "0.7.0"
grammers-mtsender = "0.7.0"
grammers-tl-types = "0.7.0"
mime_guess = "2.0"
infinidysk-archive = { path = "crates/infinidysk-archive" }
tokio-rustls = "0.26"
webpki-roots = "0.26"
mdns-sd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }


